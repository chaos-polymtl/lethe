name: CI-Release

# Called by ci.yml, which sets the triggers and concurrency, once the
# indentation and documentation checks pass
on:
  workflow_call:

env:
  COMPILE_JOBS: 4
  MULTI_CORE_TESTS_REGEX: "mpirun=[2-9][0-9]*"

jobs:
  build:
    name: Build (deal.ii:${{ matrix.dealii_version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # TODO: add "v9.8.0-noble" once the dealii/dealii:v9.8.0-noble image
        # is published on Docker Hub.
        dealii_version: ["master-noble", "v9.7.1-noble"]
    
    # Run steps in container of dealii's master branch
    container:
      image: dealii/dealii:${{ matrix.dealii_version }}
      options: --user root

    steps:
      - name: Setup
        run: |
          # Since dealii image doesn't include Node.js, we'll install it
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nodejs



          echo "Github actions is sane!"
          echo "Running build with deal.ii version ${{ matrix.dealii_version }} on branch ${GITHUB_REF#refs/heads/}"

      # Checks-out Lethe with branch of triggering commit
      - name: Checkout code
        uses: actions/checkout@v2

      # Restore/save the compiler cache to speed up recompilation
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-CI-Release-${{ matrix.dealii_version }}
          max-size: 2G

      #
      # Release
      #
      - name: Compile Lethe (Release-deal.ii:${{ matrix.dealii_version }})
        run: |
          mkdir build-release
          cd build-release
          git config --global --add safe.directory /__w/lethe/lethe
          cmake ../ -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          ninja -j${{ env.COMPILE_JOBS }}

      # The executables of the unit tests are not part of the default target.
      # If they are not compiled here, every unit test compiles its own
      # executable when ctest launches it, with its own ninja process. Since
      # the tests run in parallel, these processes then write concurrently to
      # the .ninja_deps file of the build directory, which ninja does not
      # support. The file ends up corrupted, ninja crashes (segmentation fault)
      # and every test launched afterwards fails at its BUILD stage.
      - name: Compile Lethe unit tests (Release-deal.ii:${{ matrix.dealii_version }})
        run: |
          cd build-release
          ninja -j${{ env.COMPILE_JOBS }} compile_test_executables

      # These tests require a single core each so we will run them in parallel
      # Only run tests on deal.ii master version
      # Restart files are not compatible with deal.ii v9.5.0
      - name: Run Lethe tests (Release-deal.ii:${{ matrix.dealii_version }})
#        if: ${{ matrix.dealii_version == 'master-focal'}}
        run: |
          #Allow OMPI to run as root
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          cd build-release
          # Print the tests to be executed
          ctest -N --exclude-regex ${{ env.MULTI_CORE_TESTS_REGEX }}
          # Run in parallel
          ctest --output-on-failure -j${{ env.COMPILE_JOBS }} --exclude-regex ${{ env.MULTI_CORE_TESTS_REGEX }}


      # These tests require two cores each so we will run them sequencially
      # Only run tests on deal.ii master version
      # Restart files are not compatible with deal.ii v9.5.0
      - name: Run multi-core Lethe tests (Release-deal.ii:${{ matrix.dealii_version }})
#        if: ${{ matrix.dealii_version == 'master-focal'}}
        run: |
          #Allow OMPI to run as root
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          cd build-release
          # Print the tests to be executed
          ctest -N --tests-regex ${{ env.MULTI_CORE_TESTS_REGEX }}
          # Run sequencially
          ctest --output-on-failure --tests-regex ${{ env.MULTI_CORE_TESTS_REGEX }}
